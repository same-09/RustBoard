<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rustboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient" id="ambient" aria-hidden="true"></div>

  <div class="app">
    <aside class="rail">
      <div class="logo" id="open-home" title="Home" role="button" tabindex="0">
        <svg viewBox="0 0 32 24" aria-hidden="true">
          <rect x="1" y="9" width="4" height="6" rx="2"/>
          <rect x="8" y="4" width="4" height="16" rx="2"/>
          <rect x="15" y="0" width="4" height="24" rx="2"/>
          <rect x="22" y="6" width="4" height="12" rx="2"/>
          <rect x="29" y="10" width="3" height="4" rx="1.5"/>
        </svg>
      </div>
      <button class="rail-btn" id="open-settings" title="Settings" aria-label="Settings"></button>
    </aside>

    <div class="page">
      <header class="bar">
        <button class="island preset-btn" id="preset-btn" title="Presets" aria-haspopup="menu">
          <span id="preset-name"></span>
          <span class="chev" id="preset-chev"></span>
        </button>

        <span class="grow"></span>

      </header>

      <div id="update-bar" hidden>
        <span id="update-text"></span>
        <button class="primary" id="update-btn">Download</button>
        <button id="update-later">Later</button>
      </div>

      <main class="split">
        <section class="panel" id="sounds-panel">
          <div class="panel-head">
            <h2>Sounds <span class="count" id="sound-count"></span></h2>
            <div class="vol">
              <button class="icon-btn" id="mute" title="Mute"></button>
              <input type="range" id="master" min="0" max="100" aria-label="Master volume">
            </div>
          </div>
          <div class="toolbar">
            <button class="primary" id="sound-play" title="Play selected"><span id="play-ico"></span>Play</button>
            <button class="icon-btn fill" id="sound-pause" title="Pause"></button>
            <button class="icon-btn fill" id="sound-stop" title="Stop"></button>
            <span class="grow"></span>
            <button id="sound-add" title="Add sound"><span id="add-ico"></span>Add sound</button>
          </div>
          <div class="list" id="sound-list"></div>
        </section>
      </main>

      <main class="settings" id="settings-page" hidden>
        <section class="panel">
          <div class="panel-head"><h2>Settings</h2></div>
          <div class="set-scroll" id="settings-body"></div>
        </section>
      </main>

      <div class="live-dock">
        <button class="island live-btn" id="go-live" title="Send your sounds and your mic to Discord through the virtual cable (VB-CABLE)">
          <span id="live-ico"></span>
          <span id="live-label">Go Live</span>
        </button>
      </div>
    </div>
  </div>

  <dialog id="dlg">
    <div class="modal-head"><h3 id="dlg-title"></h3></div>
    <div class="modal-body" id="dlg-body"></div>
    <div class="modal-foot" id="dlg-foot"></div>
  </dialog>

  <dialog id="bind">
    <div class="modal-body bind-body">
      <p class="bind-title">Press the keys, then let go</p>
      <p class="muted">Hold a combo like Ctrl + F5. It saves when you release.</p>
      <div class="keys big" id="bind-live"></div>
    </div>
    <div class="modal-foot"><button id="bind-cancel">Cancel</button></div>
  </dialog>

  <div id="toast" role="status"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
