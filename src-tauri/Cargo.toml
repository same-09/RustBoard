[package]
name = "rustboard"
version = "1.0.0"
description = "Soundboard + counters with global hotkeys"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# global keyboard hook (works when window is not focused)
rdev = "0.5"
# audio: rodio 0.19 re-exports cpal 0.15, used for device list + mic passthrough
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }

# in-app update: download the setup from GitHub and check its SHA-256
ureq = "2"
sha2 = "0.10"

# AI Voice: unzip the voice models (.zip from voice-models.com)
zip = { version = "2", default-features = false, features = ["deflate"] }

# phone remote: tiny server on the local network + QR code for the link
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
