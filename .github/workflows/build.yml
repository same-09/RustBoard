name: Build Rustboard

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            setup/src-tauri

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # tag v0.0.2  ->  app version 0.0.2 (the app compares it with the newest Release)
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          foreach ($f in 'src-tauri/tauri.conf.json', 'setup/src-tauri/tauri.conf.json') {
            (Get-Content $f -Raw) -replace '"version": "[^"]*"', "`"version`": `"$v`"" | Set-Content $f
          }
          foreach ($f in 'src-tauri/Cargo.toml', 'setup/src-tauri/Cargo.toml') {
            (Get-Content $f -Raw) -replace '(?m)^version = "[^"]*"', "version = `"$v`"" | Set-Content $f
          }

      # Builds the app exe, then the custom setup that embeds it -> dist-setup/Rustboard_x.y.z_x64-setup.exe
      - name: Build app + custom setup
        shell: pwsh
        run: ./tools/build_setup.ps1

      # On a tag: GitHub Release + the setup attached. No signing key needed.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Rustboard ${{ github.ref_name }}
          files: dist-setup/*-setup.exe

      # Other pushes only test the build; keep the exe as a download for 7 days.
      - name: Keep the setup (no tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Rustboard-setup
          path: dist-setup/*-setup.exe
          retention-days: 7
